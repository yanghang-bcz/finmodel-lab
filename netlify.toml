# Netlify 部署配置 — FinModel Lab
# 纯静态站点：dist/ 已随仓库提交，无需构建步骤。

[build]
  publish = "dist"
  command = "echo 'static site: no build step required'"

# ---- 缓存策略 ----
# 依据：dist 内部所有资源引用都带 ?v=<hash> 指纹（见 index.html / experiments.html），
# 因此带指纹的静态资源可以安全长缓存；HTML 必须每次都回源校验，
# 否则版本升级后学生会一直看到旧页面（DEPLOYMENT.md 明确要求 HTML 及时刷新）。

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ---- 安全与兼容 ----
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
